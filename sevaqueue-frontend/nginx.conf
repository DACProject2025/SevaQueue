server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # This is CRITICAL for React Router (client-side routing)
    # Without this, refreshing on /dashboard gives 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (JS/CSS/images have hashed names)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API calls to backend services
    # Frontend calls /api/* → SevaQueueBackend on port 8081 (Backend has @RequestMapping("/api/..."))
    location /api/ {
        proxy_pass http://sevaqueue-backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Frontend calls /auth/* → AuthService on port 8080 (Auth has @RequestMapping("/auth"))
    location /auth/ {
        proxy_pass http://sevaqueue-auth:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Gzip compression for better performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
